<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032b43" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="cocktailGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="35%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Sun Circle in Background -->
  <circle cx="256" cy="190" r="110" fill="url(#sunGrad)" opacity="0.85" filter="url(#glow)" />

  <!-- Tropical Palm Fronds Silhouette subtle -->
  <path d="M400,120 Q320,130 260,190 Q340,160 400,120 Z" fill="#047857" opacity="0.3" />
  <path d="M430,160 Q340,170 270,210 Q360,190 430,160 Z" fill="#047857" opacity="0.3" />

  <!-- Party Straw (Striped Angle) -->
  <line x1="280" y1="280" x2="360" y2="90" stroke="#f43f5e" stroke-width="14" stroke-linecap="round" />
  <line x1="280" y1="280" x2="360" y2="90" stroke="#ffffff" stroke-width="14" stroke-dasharray="16 16" stroke-linecap="round" />

  <!-- 32-oz Hurricane / Souvenir Glass Body -->
  <path d="M196,160 C196,160 180,240 216,290 C234,315 240,340 240,370 L230,390 L200,390 C190,390 184,398 184,408 C184,418 190,424 200,424 L312,424 C322,424 328,418 328,408 C328,398 322,390 312,390 L282,390 L272,370 C272,340 278,315 296,290 C332,240 316,160 316,160 Z" 
        fill="rgba(255, 255, 255, 0.18)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" />

  <!-- Cocktail Liquid Fill -->
  <path d="M202,185 C202,185 188,245 221,288 C238,310 245,335 245,364 L267,364 C267,335 274,310 291,288 C324,245 310,185 310,185 Z" 
        fill="url(#cocktailGrad)" />

  <!-- Ice Cubes inside Glass -->
  <rect x="225" y="210" width="30" height="30" rx="6" fill="rgba(255,255,255,0.7)" transform="rotate(12 240 225)" />
  <rect x="255" y="250" width="28" height="28" rx="6" fill="rgba(255,255,255,0.7)" transform="rotate(-15 269 264)" />

  <!-- Lime Wheel Garnish on Rim -->
  <circle cx="185" cy="165" r="38" fill="#84cc16" stroke="#ffffff" stroke-width="4" />
  <circle cx="185" cy="165" r="30" fill="#a3e635" />
  <!-- Lime Wheel Spokes -->
  <line x1="185" y1="135" x2="185" y2="195" stroke="#ffffff" stroke-width="2" />
  <line x1="155" y1="165" x2="215" y2="165" stroke="#ffffff" stroke-width="2" />
  <line x1="164" y1="144" x2="206" y2="186" stroke="#ffffff" stroke-width="2" />
  <line x1="164" y1="186" x2="206" y2="144" stroke="#ffffff" stroke-width="2" />

  <!-- Maraschino Cherry -->
  <circle cx="215" cy="145" r="18" fill="#e11d48" />
  <path d="M225,135 Q245,110 255,95" fill="none" stroke="#713f12" stroke-width="4" stroke-linecap="round" />

  <!-- Badge / Text at Bottom -->
  <rect x="76" y="440" width="360" height="42" rx="21" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="2" />
  <text x="256" y="468" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">SMART BAR</text>
</svg>
